<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/assets/style.css">
<title>Family map — MapHeritage</title>
<meta property="og:title" content="Family map">
<meta property="og:description" content="A family’s story on one map — MapHeritage">
<style>
  .top { display: flex; align-items: center; gap: 16px; padding: 14px clamp(16px, 4vw, 48px); }
  .top .langbtn { margin-left: auto; }
  .head { padding: clamp(20px, 3vw, 36px) clamp(16px, 4vw, 48px) 22px; display: grid; grid-template-columns: 1fr auto; gap: 18px 32px; align-items: end; }
  .head h1 { font-size: clamp(40px, 6.5vw, 96px); line-height: .95; letter-spacing: -0.045em; }
  .head .sub { margin: 12px 0 14px; font-size: 18px; color: var(--ink-2); }
  .head .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .stage { border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  #map { height: 76svh; min-height: 440px; }
  .chronicle { padding: clamp(56px, 8vw, 110px) clamp(16px, 4vw, 48px); max-width: 1320px; margin: 0 auto; }
  .chronicle > h2 { font-size: clamp(34px, 4.6vw, 60px); letter-spacing: -0.035em; margin-bottom: 40px; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 48px 40px; }
  .person h3 { font-size: 27px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 3px solid var(--ink); margin-bottom: 4px; }
  .person h3 i { width: 16px; height: 16px; flex: none; }
  .person h3 small { font-size: 15px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
  .person ol { list-style: none; margin: 0; padding: 0; }
  .person li { display: grid; grid-template-columns: 5.4em 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grey); }
  .person li b { font-weight: 600; }
  .person li span { color: var(--ink-2); font-size: 15px; }
  .person li strong { color: var(--ink); font-weight: 500; font-size: 16px; }
  .cta { background: var(--blue); color: #fff; padding: 40px clamp(16px, 4vw, 48px); display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .cta p { margin: 0; font: 600 clamp(24px, 3vw, 34px)/1.1 var(--font); letter-spacing: -0.02em; }
  .cta .btn { background: #fff; color: var(--blue); border-color: #fff; }
  .cta .btn:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  @media (max-width: 760px) { .head { grid-template-columns: 1fr; } .head .actions { justify-content: flex-start; } #map { height: 64svh; } }
  @media print {
    @page { margin: 12mm; }
    .top, .head .actions, .cta, .leaflet-control-zoom { display: none !important; }
    #map { height: 150mm; min-height: 0; }
    .chronicle { padding: 10mm 0 0; }
    .person { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="top"><a class="brand" href="/"><svg width="36" height="20" viewBox="0 0 36 20" aria-hidden="true"><path d="M5 15 L18 5 L31 15" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/><circle cx="5" cy="15" r="4" fill="#E0301E" stroke="#000" stroke-width="2"/><circle cx="18" cy="5" r="4" fill="#F2B705" stroke="#000" stroke-width="2"/><circle cx="31" cy="15" r="4" fill="#1F3FBF" stroke="#000" stroke-width="2"/></svg> MapHeritage</a><button class="langbtn" type="button" data-lang-toggle>RU</button></header>
<section class="head">
  <div>
    <h1 id="title">Family map</h1>
    <p class="sub" id="sub"></p>
    <ul class="legend" id="legend"></ul>
  </div>
  <div class="actions" id="actions">
    <button class="btn small primary" id="play" type="button" data-i18n="btn.play">Play journey</button>
    <button class="btn small" id="download" type="button" data-i18n="btn.download">Download image</button>
    <button class="btn small" id="share" type="button" data-i18n="btn.share">Share</button>
    <button class="btn small" id="print" type="button" data-i18n="btn.print">Print</button>
    <a class="btn small" id="edit" href="#" hidden data-i18n="btn.continue">Edit map</a>
  </div>
</section>
<div class="stage"><div id="map"></div></div>
<section class="chronicle" id="chronicle" hidden>
  <h2 data-i18n="chronicle">Chronicle</h2>
  <div class="people" id="people"></div>
</section>
<div class="cta"><p data-i18n="cta.own">Make a map of your own family.</p><a class="btn big" href="/create" data-i18n="hero.cta">Create your family map</a></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/mapkit.js"></script>
<script>
const $ = (id) => document.getElementById(id), esc = MapKit.esc, { t, plural } = I18N;
const id = location.pathname.split('/')[2] || new URLSearchParams(location.search).get('id');
const kit = MapKit.create($('map'), { scrollWheelZoom: false });
let data = null, failed = null;
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600); }
function subtitle() {
  const geo = data.events.filter(MapKit.hasGeo), years = data.events.map((e) => e.year).filter(Boolean);
  const n = new Set(geo.map((e) => e.lat.toFixed(2) + ',' + e.lng.toFixed(2))).size;
  return n + ' ' + plural(n, 'count.places') + (years.length ? ', ' + Math.min(...years) + '–' + Math.max(...years) : '');
}
function paint() {
  I18N.apply();
  if (failed) { $('title').textContent = t('notFound.t'); $('sub').textContent = t(failed); $('actions').hidden = true; return; }
  if (!data) return;
  const title = data.title || t('familyMap');
  $('title').textContent = title; document.title = title + ' — MapHeritage';
  $('sub').textContent = subtitle();
  const col = MapKit.colors(data.people), used = new Set(data.events.map((e) => e.personId));
  const people = data.people.filter((p) => used.has(p.id));
  $('legend').innerHTML = people.map((p) => `<li><i style="background:${col[p.id]}"></i>${esc(p.name)} <small>${esc(MapKit.rel(p.relation))}</small></li>`).join('');
  $('chronicle').hidden = !data.events.length;
  $('people').innerHTML = people.map((p) => `<article class="person"><h3><i style="background:${col[p.id]}"></i>${esc(p.name)}<small>${esc(MapKit.rel(p.relation))}</small></h3><ol>${
    MapKit.chrono(data.events.filter((e) => e.personId === p.id)).map((e) => `<li><b>${esc(e.when || '—')}</b><span><strong>${esc(e.place)}</strong>${e.type !== 'other' ? ', ' + esc(t('type.' + e.type)) : ''}${e.note ? '. ' + esc(e.note) : ''}</span></li>`).join('')
  }</ol></article>`).join('');
}
async function load() {
  try {
    const r = await fetch('/api/maps/' + encodeURIComponent(id || ''));
    if (!r.ok) { failed = r.status === 404 ? 'notFound.p' : 'loadFail'; return paint(); }
    data = await r.json();
  } catch { failed = 'loadFail'; return paint(); }
  paint();
  try { if ((JSON.parse(localStorage.getItem('mh:maps')) || []).some((m) => m.id === id)) { $('edit').hidden = false; $('edit').href = '/create?id=' + id + '&tab=edit'; } } catch {}
  kit.render(data, { animate: true, stepMs: 560 });
}
$('play').onclick = () => data && kit.render(data, { animate: true, stepMs: 560 });
$('print').onclick = () => { if (data) { kit.render(data, { fit: false }); setTimeout(() => print(), 400); } };
$('download').onclick = async () => {
  if (!data || !data.events.some(MapKit.hasGeo)) return toast(t('toast.emptyMap'));
  const b = $('download'); b.disabled = true;
  try {
    kit.render(data); await kit.waitTiles();
    const title = data.title || t('familyMap');
    const { blob, tiles } = await kit.exportPNG(data, { title, subtitle: subtitle() });
    MapKit.download(blob, MapKit.slug(title) + '.png');
    toast(t(tiles ? 'toast.exported' : 'toast.noTiles'));
  } catch (e) { toast(e.message || 'Export failed'); }
  b.disabled = false;
};
$('share').onclick = async () => {
  const url = location.origin + '/m/' + id;
  if (navigator.share) { try { await navigator.share({ title: document.title, url }); return; } catch {} }
  try { await navigator.clipboard.writeText(url); toast(t('toast.copied')); } catch { prompt(t('btn.share'), url); }
};
I18N.on(() => { paint(); kit.rerender(); });
addEventListener('resize', () => kit.invalidate());
paint(); load();
</script>
</body>
</html>
