<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/assets/style.css">
<title>Create a family map — MapHeritage</title>
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-columns: minmax(340px, 470px) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1.5px solid var(--ink); background: var(--page); z-index: 10; }
  .bar .brand span { font-size: 19px; }
  .bar .title { flex: 1; min-width: 0; font: 700 22px/1.2 var(--display); border: 0; border-bottom: 1px dashed transparent; background: none; color: var(--ink); padding: 4px 2px; }
  .bar .title:hover { border-bottom-color: var(--rule); }
  .bar .title:focus { outline: none; border-bottom-color: var(--ink); }
  .bar .tools { display: flex; gap: 8px; align-items: center; }
  .bar select, .ed select, .ed input, .ed textarea { font: 15px/1.3 var(--ui); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 2px; background: var(--card); color: var(--ink); min-width: 0; }
  .bar select { max-width: 160px; height: 32px; padding: 0 6px; }
  .ed select:focus, .ed input:focus, .ed textarea:focus { outline: none; border-color: var(--ink); }
  .tabs { grid-column: 1; display: flex; border-right: 1.5px solid var(--ink); background: var(--page); }
  .tabs button { flex: 1; padding: 11px 6px 9px; border: 0; border-bottom: 2px solid var(--rule); background: none; font: 500 15px var(--ui); color: var(--ink-2); cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
  .tabs .only-sm { display: none; }
  .panel { grid-column: 1; grid-row: 3; min-height: 0; display: flex; flex-direction: column; border-right: 1.5px solid var(--ink); background: var(--page); }
  .app:not([data-view="chat"]) .chat, .app:not([data-view="edit"]) #edit, .app:not([data-view="design"]) #design, .app:not([data-view="import"]) #import { display: none; }
  .app[data-view="map"] .chat { display: flex; }

  .log { flex: 1; overflow-y: auto; padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { font: 18px/1.5 var(--serif); padding-left: 14px; border-left: 2px solid var(--red); }
  .msg.me { align-self: flex-end; background: var(--card); border: 1px solid var(--rule); padding: 9px 13px; font-size: 16px; border-radius: 2px; }
  .msg.err { color: var(--red); font-size: 15px; font-weight: 500; }
  .typing { font: italic 16px var(--serif); color: var(--ink-2); padding-left: 16px; }
  .typing::after { content: '…'; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.1em; } }
  .compose { display: flex; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); align-items: flex-end; }
  .compose textarea { flex: 1; resize: none; font: 16px/1.4 var(--ui); padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--card); color: var(--ink); min-height: 48px; max-height: 160px; }
  .compose textarea:focus { outline: none; border-color: var(--red); }
  .hint { font-size: 12px; color: var(--ink-2); padding: 0 16px 10px; margin: -8px 0 0; }
  .start { padding: 26px 20px; overflow-y: auto; }
  .start h2 { font-size: 26px; margin-bottom: 16px; }
  .start button.mode { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--ink); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; font: inherit; color: var(--ink); border-radius: 2px; }
  .start button.mode:hover { border-color: var(--ink); border-left-color: var(--red); }
  .start button.mode b { display: block; font: 700 19px/1.2 var(--display); margin-bottom: 4px; }
  .start button.mode span { color: var(--ink-2); font-size: 15px; }
  .start div.mode { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--red); padding: 14px 16px; margin-bottom: 10px; border-radius: 2px; }
  .start div.mode b { display: block; font: 700 19px/1.2 var(--display); margin-bottom: 4px; }
  .start div.mode > span { color: var(--ink-2); font-size: 15px; display: block; margin-bottom: 10px; }
  .start div.mode label { margin: 0 0 12px; }
  .two-ways { display: flex; gap: 8px; flex-wrap: wrap; }
  .start label { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; margin: -2px 0 16px 6px; }

  .ed { overflow-y: auto; padding: 18px 20px 48px; }
  .ed h3 { font-size: 19px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
  .ed section + section { margin-top: 28px; }
  .ed p.note { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows > li { border-top: 1px solid var(--rule); }
  .rows > li:last-child { border-bottom: 1px solid var(--rule); }
  .row { width: 100%; display: grid; grid-template-columns: 12px 4.4em 1fr; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 9px 2px; font: 15px/1.35 var(--ui); color: var(--ink); cursor: pointer; }
  .row:hover { background: var(--card); }
  .row i { width: 12px; height: 12px; border-radius: 50%; transform: translateY(1px); border: 1px solid var(--ink); }
  .row b { font-weight: 700; }
  .row em { font-style: normal; color: var(--ink-2); display: block; font-size: 13px; }
  .row em.warn { color: var(--red); }
  .row.person { grid-template-columns: 12px 1fr auto; }
  .row .root { font: italic 13px var(--serif); color: var(--red); }
  .form { padding: 12px 0 16px; display: grid; gap: 10px; }
  .form label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form .inline { display: flex; gap: 8px; align-items: center; }
  .form .inline input { flex: 1; }
  .form textarea { resize: vertical; min-height: 54px; }
  .form .acts { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
  .form .acts .del { margin-left: auto; color: var(--red); }
  .geo { font-size: 14px; font-weight: 500; flex: 1; }
  .geo.no { color: var(--red); }
  .sws { display: flex; flex-wrap: wrap; gap: 6px; }
  .sws button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sws button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--page) inset; }

  .ctl { display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px 12px; align-items: center; font-size: 14px; margin-bottom: 8px; }
  .ctl > span { color: var(--ink-2); }
  .ctl input[type=range] { width: 100%; accent-color: var(--red); }
  .ctl input[type=color] { width: 100%; height: 30px; padding: 2px; border: 1px solid var(--rule); background: var(--card); border-radius: 2px; cursor: pointer; }
  .seg { display: flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: none; padding: 6px 4px; font: 500 13px var(--ui); color: var(--ink); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; }
  .checks label, .picks label { display: flex; gap: 7px; align-items: center; cursor: pointer; }
  .checks input, .picks input { accent-color: var(--red); }
  .picks { display: grid; gap: 4px; font-size: 14px; max-height: 210px; overflow-y: auto; border: 1px solid var(--rule); padding: 8px 10px; background: var(--card); margin-top: 6px; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .presets button { border: 1px solid var(--rule); border-radius: 2px; padding: 0; cursor: pointer; background: var(--card); text-align: left; overflow: hidden; font: 500 14px var(--ui); color: var(--ink); }
  .presets button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .presets button i { display: block; height: 34px; }
  .presets button span { display: block; padding: 6px 8px; }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .palette input { width: 100%; height: 28px; padding: 1px; border: 1px solid var(--rule); border-radius: 2px; background: var(--card); cursor: pointer; }
  .progress { height: 6px; background: var(--card); border: 1px solid var(--rule); margin-top: 10px; }
  .progress i { display: block; height: 100%; background: var(--red); width: 0; transition: width .3s; }

  .stage { grid-column: 2; grid-row: 2 / 4; position: relative; min-height: 0; background: var(--table); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pickbar { position: absolute; z-index: 700; left: 50%; top: 14px; transform: translateX(-50%); background: var(--card); border: 1.5px solid var(--ink); padding: 8px 10px 8px 14px; display: flex; gap: 12px; align-items: center; font-weight: 500; max-width: calc(100% - 24px); }
  .stage .hintbox { position: absolute; left: 12px; bottom: 10px; font: italic 13px var(--serif); color: var(--ink-2); }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .tabs { border-right: 0; } .tabs .only-sm { display: block; } .tabs button { font-size: 13px; padding: 10px 2px 8px; }
    .panel { border-right: 0; }
    .stage { grid-column: 1; grid-row: 3; }
    .app[data-view="map"] .panel { display: none !important; }
    .app:not([data-view="map"]) .stage { display: none; }
    .bar { gap: 6px; padding: 8px 10px; } .bar .brand span, .bar .hide-sm { display: none; }
    .bar .title { font-size: 18px; } .bar .btn.small { padding: .45em .55em; font-size: 13px; }
  }

  .authpanel { grid-column: 1 / -1; grid-row: 2 / 4; overflow-y: auto; display: grid; grid-template-columns: minmax(320px, 520px) 1fr; }
  .authpanel .side { padding: clamp(28px, 5vw, 64px); border-right: 1.5px solid var(--ink); }
  .authpanel .pic { background: var(--table); display: flex; align-items: center; justify-content: center; padding: 32px; }
  .authpanel .pic blockquote { max-width: 520px; margin: 0; font: italic 26px/1.35 var(--serif); color: var(--ink); }
  body[data-auth="out"] .tabs, body[data-auth="out"] .panel, body[data-auth="out"] .stage, body[data-auth="out"] .bar .tools > :not(#avatar) , body[data-auth="out"] .bar .title { display: none !important; }
  .insp { position: absolute; z-index: 800; right: 14px; top: 14px; width: min(300px, calc(100% - 28px)); background: var(--card); border: 1.5px solid var(--ink); border-radius: 2px; box-shadow: 0 8px 24px rgba(46,34,22,.22); padding: 14px 14px 12px; font-size: 14px; }
  .insp h4 { margin: 0 0 10px; font: 700 17px/1.2 var(--display); display: flex; justify-content: space-between; align-items: center; }
  .insp h4 button { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--ink-2); }
  .insp label { display: grid; gap: 4px; margin-bottom: 10px; color: var(--ink-2); font-weight: 500; font-size: 13px; }
  .insp input:not([type=range]), .insp select { font: 15px var(--ui); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; color: var(--ink); }
  .insp input[type=range] { accent-color: var(--red); }
  .insp .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .insp p { margin: 0 0 10px; color: var(--ink-2); font: italic 14px var(--serif); }
  .insp [disabled] { opacity: .45; }
  .pop.share { right: 14px; top: 14px; width: min(340px, calc(100% - 28px)); padding: 14px; }
  .pop.share h4 { margin: 0 0 10px; font: 700 17px var(--display); }
  .pop.share label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
  .pop.share input[type=text] { width: 100%; font: 14px var(--ui); padding: 7px 8px; border: 1px solid var(--rule); background: #fff; margin-bottom: 8px; }
  .msgwrap { display: flex; flex-direction: column; gap: 4px; }
  .msgwrap.me { align-items: flex-end; }
  .msgwrap .editbtn { font: 12px var(--ui); color: var(--ink-2); background: none; border: 0; cursor: pointer; padding: 0 2px; opacity: 0; }
  .msgwrap:hover .editbtn, .msgwrap .editbtn:focus { opacity: 1; }
  .msgwrap textarea { width: min(100%, 420px); font: 16px/1.4 var(--ui); padding: 9px 12px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--card); min-height: 70px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 16px; }
  .chips button { font: 14px var(--ui); background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
  .chips button:hover { border-color: var(--red); color: var(--red); }
  .ctl.locked, .locked-sec { opacity: .5; pointer-events: none; }
  details.dsec { border-top: 1px solid var(--rule); padding: 10px 0; }
  details.dsec:last-of-type { border-bottom: 1px solid var(--rule); }
  details.dsec summary { cursor: pointer; font: 700 17px var(--display); list-style-position: inside; }
  details.dsec.locked-sec { pointer-events: auto; opacity: 1; } details.dsec.locked-sec .dbody { pointer-events: none; opacity: .5; } details.dsec.locked-sec summary { color: var(--ink-2); }
  details.dsec .dbody { padding-top: 12px; }
  .ed h3.prohead { margin-top: 30px; }
  .ed p.grp { margin: 10px 0 4px; font-weight: 500; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
  .rows li.mini { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 6px; align-items: center; padding: 6px 0; }
  .rows li.mini.tx { grid-template-columns: 1.4fr 1fr 1fr 1fr auto; }
  .rows li.mini input[type=range] { min-width: 0; accent-color: var(--red); }
  .ed .acts { display: flex; gap: 8px; margin: 8px 0; }
  @media (max-width: 860px) { .authpanel { grid-template-columns: 1fr; } .authpanel .pic { display: none; } .authpanel .side { border-right: 0; } }
</style>
</head>
<body>
<div class="app" data-view="chat">
  <header class="bar">
    <a class="brand" href="/" aria-label="MapHeritage" id="brand"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="3"/><path d="M32 4 L38 32 L32 60 L26 32 Z" fill="currentColor"/><path d="M32 4 L38 32 L32 32 Z" fill="#9B2F1F"/><path d="M4 32 L32 26 L60 32 L32 38 Z" fill="currentColor" opacity=".5"/></svg><span>MapHeritage</span></a>
    <button class="langbtn" type="button" data-lang-toggle>RU</button>
    <input class="title" id="title" data-i18n-ph="title.ph" placeholder="My family map" maxlength="90" aria-label="Map title">
    <div class="tools">
      <select id="myMaps" class="hide-sm" hidden data-i18n-label="myMaps"></select>
      <button class="btn small hide-sm" id="newMap" type="button" data-i18n="btn.new">New map</button>
      <a class="btn small hide-sm" id="viewMap" href="#" target="_blank" rel="noopener" data-i18n="btn.open">Open map</a>
      <button class="btn small" id="export" type="button" data-i18n="btn.export">Export PNG</button>
      <button class="btn small primary" id="share" type="button" data-i18n="btn.share">Share</button>
      <button class="avatar" id="avatar" type="button" hidden></button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="chat" data-i18n="tab.chat">Chat</button>
    <button role="tab" data-view="edit" data-i18n="tab.edit">Edit</button>
    <button role="tab" data-view="design" data-i18n="tab.design">Design</button>
    <button role="tab" data-view="import" data-i18n="tab.import">Import</button>
    <button role="tab" data-view="map" class="only-sm" data-i18n="tab.map">Map</button>
  </nav>

  <section class="panel chat">
    <div class="start" id="start" hidden></div>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="compose" id="form">
      <textarea id="input" rows="1" data-i18n-ph="input.ph" placeholder="Type your answer…" maxlength="2000" aria-label="Your answer"></textarea>
      <button class="btn primary" id="send" type="submit" data-i18n="btn.send">Send</button>
    </form>
    <p class="hint" id="hint" data-i18n="hint">Enter to send, Shift + Enter for a new line.</p>
  </section>
  <section class="panel ed" id="edit"></section>
  <section class="panel ed" id="design"></section>
  <section class="panel ed" id="import"></section>
  <section class="authpanel" id="auth" hidden></section>

  <section class="stage" id="stage">
    <div class="insp" id="insp" hidden></div>
    <div class="pop share" id="sharePop" hidden></div>
    <div class="pickbar" id="pickbar" hidden><span data-i18n="f.picking">Click the map to set the location</span><button class="btn small" type="button" id="pickCancel" data-i18n="f.cancel">Cancel</button></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/basemap.js"></script>
<script src="/assets/poster.js"></script>
<script src="/assets/account.js"></script>
<script src="/assets/gedcom.js"></script>
<script src="/assets/print.js"></script>
<script src="/assets/create.js"></script>
</body>
</html>
