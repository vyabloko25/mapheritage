<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Создать карту семьи — MapHeritage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/assets/style.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-columns: minmax(330px, 440px) 1fr; grid-template-rows: auto 1fr; }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--paper); z-index: 10; }
  .bar .title { flex: 1; min-width: 0; font: 400 21px/1.2 var(--display); border: 0; border-bottom: 1px dashed transparent; background: none; color: var(--ink); padding: 4px 2px; }
  .bar .title:hover, .bar .title:focus { border-bottom-color: var(--rule); outline: none; }
  .bar .tools { display: flex; gap: 8px; align-items: center; }
  .bar select { font: 14px var(--text); padding: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); max-width: 170px; }

  .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); background: var(--paper); }
  .log { flex: 1; overflow-y: auto; padding: 22px 20px 10px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { font: 18px/1.5 var(--display); padding-left: 14px; border-left: 2px solid var(--red); }
  .msg.me { align-self: flex-end; background: var(--sea); padding: 9px 13px; border-radius: 3px 3px 0 3px; font-size: 16px; }
  .msg.err { color: var(--red-dark); font-size: 15px; border-left: 2px solid var(--red-dark); padding-left: 12px; }
  .typing { font: italic 16px var(--display); color: var(--ink-2); padding-left: 16px; }
  .typing::after { content: '…'; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.1em; } }

  .places { border-top: 1px solid var(--rule); font-size: 14px; }
  .places summary { cursor: pointer; padding: 10px 20px; color: var(--ink-2); }
  .places ul { list-style: none; margin: 0; padding: 0 20px 10px; max-height: 30vh; overflow-y: auto; }
  .places li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--sea-deep); }
  .places li i { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid var(--ink); transform: translateY(1px); }
  .places li span { flex: 1; }
  .places li em { color: var(--ink-2); font-style: normal; font-size: 12px; }
  .places li button { border: 0; background: none; color: var(--ink-2); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
  .places li button:hover { color: var(--red); }

  .compose { display: flex; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); align-items: flex-end; }
  .compose textarea { flex: 1; resize: none; font: 16px/1.4 var(--text); padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink); min-height: 46px; max-height: 160px; }
  .compose textarea:focus { outline: none; border-color: var(--red); }
  .hint { font-size: 12px; color: var(--ink-2); padding: 0 16px 10px; margin: -8px 0 0; }

  .mapcol { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  .empty { position: absolute; z-index: 500; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, 80%); text-align: center; }
  .empty p { margin: 10px 0 0; color: var(--ink-2); font-size: 15px; }
  .empty h2 { font-size: 26px; }
  .mapcol .legendbox { position: absolute; z-index: 500; left: 12px; bottom: 26px; background: rgba(250,250,246,.94); border: 1px solid var(--rule); padding: 10px 12px; max-width: 240px; }
  .tabs { display: none; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .tabs { display: flex; border-bottom: 1px solid var(--rule); background: var(--paper); }
    .tabs button { flex: 1; padding: 10px; border: 0; background: none; font: 700 15px var(--text); color: var(--ink-2); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
    .app[data-tab="chat"] .mapcol, .app[data-tab="map"] .chat { display: none; }
    .chat { border-right: 0; }
    .bar .hide-sm { display: none; }
    .bar .title { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app" data-tab="chat">
  <div class="bar">
    <a class="brand" href="/" title="На главную"><b>Map</b>Heritage</a>
    <input class="title" id="title" placeholder="Карта моей семьи" aria-label="Название карты" maxlength="80">
    <div class="tools">
      <select id="myMaps" hidden aria-label="Мои карты"></select>
      <button class="btn small hide-sm" id="newMap" type="button">Новая карта</button>
      <a class="btn small" id="viewMap" href="#" target="_blank" rel="noopener">Открыть карту</a>
      <button class="btn small primary" id="share" type="button">Поделиться</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="chat">Разговор</button>
    <button role="tab" aria-selected="false" data-tab="map">Карта <span id="tabCount"></span></button>
  </div>

  <section class="chat" aria-label="Разговор с помощником">
    <div class="log" id="log" aria-live="polite"></div>
    <details class="places" id="places" hidden><summary id="placesSum"></summary><ul id="placesList"></ul></details>
    <form class="compose" id="form">
      <textarea id="input" rows="1" placeholder="Напишите ответ…" aria-label="Ваш ответ" maxlength="2000"></textarea>
      <button class="btn primary" id="send" type="submit">Отправить</button>
    </form>
    <p class="hint">Enter — отправить, Shift + Enter — новая строка. Карту видят только те, у кого есть ссылка.</p>
  </section>

  <section class="mapcol" aria-label="Карта">
    <div id="map"></div>
    <div class="empty cartouche" id="empty">
      <h2>Здесь появится ваша карта</h2>
      <p>Отвечайте на вопросы слева — каждое место, о котором вы расскажете, ляжет на карту.</p>
    </div>
    <div class="legendbox" id="legendbox" hidden><ul class="legend" id="legend"></ul></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/assets/mapkit.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = MapKit.esc;
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let cur = null;          // { id, token }
let state = { title: '', people: [], events: [] };
let busy = false;
const kit = MapKit.create($('map'));

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); }

async function api(path, body, method = 'POST') {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Сервер ответил не так, как ожидалось (' + r.status + ').' }));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Ошибка ' + r.status), { status: r.status });
  return j;
}

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

function myMaps() { return store.get('mh:maps', []); }
function remember(m) {
  const list = myMaps().filter((x) => x.id !== m.id);
  list.unshift({ id: m.id, token: m.token, title: m.title || '' });
  store.set('mh:maps', list.slice(0, 30));
  store.set('mh:current', m.id);
  renderMyMaps();
}
function renderMyMaps() {
  const list = myMaps(), sel = $('myMaps');
  sel.hidden = list.length < 2;
  sel.innerHTML = list.map((m) => `<option value="${m.id}" ${cur && m.id === cur.id ? 'selected' : ''}>${esc(m.title || 'Без названия')}</option>`).join('');
}

function draw(newState, animateNew) {
  const before = new Set(state.events.map((e) => e.id));
  state = newState;
  const fresh = new Set(animateNew ? state.events.filter((e) => !before.has(e.id)).map((e) => e.id) : []);
  kit.render(state, { highlight: fresh });

  const col = MapKit.colors(state.people);
  const withGeo = state.events.filter(MapKit.hasGeo);
  $('empty').hidden = withGeo.length > 0;
  $('tabCount').textContent = withGeo.length ? '(' + withGeo.length + ')' : '';
  const used = new Set(state.events.map((e) => e.personId));
  const people = state.people.filter((p) => used.has(p.id));
  $('legendbox').hidden = people.length < 2;
  $('legend').innerHTML = people.map((p) => `<li><i style="background:${col[p.id]}"></i>${esc(p.name)} <small>${esc(p.relation === 'я' ? '' : p.relation)}</small></li>`).join('');

  const names = Object.fromEntries(state.people.map((p) => [p.id, p.name]));
  $('places').hidden = !state.events.length;
  $('placesSum').textContent = 'На карте: ' + state.events.length + ' ' + plural(state.events.length, ['событие', 'события', 'событий']);
  $('placesList').innerHTML = MapKit.chrono(state.events).map((e) => `
    <li><i style="background:${col[e.personId]}"></i>
      <span>${esc(e.when || '—')}, ${esc(e.place)} <em>${esc(names[e.personId] || '')}${MapKit.TYPES[e.type] ? ', ' + MapKit.TYPES[e.type] : ''}${MapKit.hasGeo(e) ? '' : ' (место не найдено)'}</em></span>
      <button type="button" data-rm="${esc(e.id)}" title="Убрать с карты" aria-label="Убрать ${esc(e.place)}">×</button></li>`).join('');
  if (document.activeElement !== $('title')) $('title').value = state.title || '';
  $('viewMap').href = '/m/' + cur.id;
}
function plural(n, f) { const a = n % 10, b = n % 100; return f[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? 1 : 2]; }

async function open(id) {
  const m = myMaps().find((x) => x.id === id);
  if (!m) return createNew();
  cur = { id: m.id, token: m.token };
  $('log').innerHTML = '';
  state = { title: '', people: [], events: [] };
  try {
    const h = await api(`/api/maps/${id}/history`, { token: m.token });
    h.messages.forEach((x) => addMsg(x.role === 'assistant' ? 'bot' : 'me', x.content));
    draw(h.map, false);
    remember({ ...cur, title: h.map.title });
  } catch (e) {
    if (e.status === 404 || e.status === 403) {
      store.set('mh:maps', myMaps().filter((x) => x.id !== id));
      return createNew();
    }
    addMsg('err', e.message);
  }
}

async function createNew() {
  $('log').innerHTML = '';
  state = { title: '', people: [], events: [] };
  try {
    const r = await api('/api/maps');
    cur = { id: r.id, token: r.token };
    remember({ ...cur, title: '' });
    r.messages.forEach((x) => addMsg('bot', x.content));
    draw(r.map, false);
    history.replaceState(null, '', '/create?id=' + r.id);
  } catch (e) { addMsg('err', e.message); }
}

async function send(text) {
  if (busy || !text.trim() || !cur) return;
  busy = true; $('send').disabled = true;
  addMsg('me', text);
  $('input').value = ''; grow();
  const t = document.createElement('div'); t.className = 'typing'; t.textContent = 'Записываю';
  $('log').appendChild(t); $('log').scrollTop = $('log').scrollHeight;
  try {
    const r = await api(`/api/maps/${cur.id}/chat`, { token: cur.token, message: text });
    t.remove();
    addMsg('bot', r.reply);
    const added = r.map.events.length - state.events.length;
    draw(r.map, true);
    remember({ ...cur, title: r.map.title });
    if (added > 0 && innerWidth <= 820) $('tabCount').textContent = '(' + r.map.events.filter(MapKit.hasGeo).length + ') ●';
  } catch (e) {
    t.remove();
    addMsg('err', e.message);
    $('input').value = text; grow();
  } finally { busy = false; $('send').disabled = false; $('input').focus(); }
}

function grow() { const i = $('input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight + 3, 160) + 'px'; }
$('input').addEventListener('input', grow);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); } });
$('form').addEventListener('submit', (e) => { e.preventDefault(); send($('input').value); });

$('placesList').addEventListener('click', async (e) => {
  const id = e.target.dataset && e.target.dataset.rm;
  if (!id) return;
  try { draw(await api(`/api/maps/${cur.id}`, { token: cur.token, removeEvent: id }, 'PATCH'), false); toast('Убрано с карты'); }
  catch (err) { toast(err.message); }
});
$('title').addEventListener('change', async () => {
  try { const m = await api(`/api/maps/${cur.id}`, { token: cur.token, title: $('title').value }, 'PATCH'); state.title = m.title; remember({ ...cur, title: m.title }); toast('Название сохранено'); }
  catch (err) { toast(err.message); }
});
$('share').addEventListener('click', async () => {
  const url = location.origin + '/m/' + cur.id;
  if (navigator.share && innerWidth <= 820) { try { await navigator.share({ title: state.title || 'Карта семьи', url }); return; } catch {} }
  try { await navigator.clipboard.writeText(url); toast('Ссылка на карту скопирована'); }
  catch { prompt('Ссылка на карту:', url); }
});
$('newMap').addEventListener('click', () => {
  if (state.events.length && !confirm('Начать новую карту? Текущая сохранится — вернуться к ней можно через список «Мои карты».')) return;
  createNew();
});
$('myMaps').addEventListener('change', (e) => open(e.target.value));
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  document.querySelector('.app').dataset.tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  if (b.dataset.tab === 'map') { kit.invalidate(); kit.fit(state.events); $('tabCount').textContent = $('tabCount').textContent.replace(' ●', ''); }
}));
addEventListener('resize', () => kit.invalidate());

const want = new URLSearchParams(location.search).get('id') || store.get('mh:current', null);
if (want && myMaps().some((m) => m.id === want)) open(want); else createNew();
$('input').focus();
</script>
</body>
</html>
