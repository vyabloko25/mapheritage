<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/assets/style.css">
<title>Create a family map — MapHeritage</title>
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-columns: minmax(340px, 460px) 1fr; grid-template-rows: auto auto 1fr; }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 3px solid var(--ink); background: var(--paper); z-index: 10; }
  .bar .brand span { display: none; }
  .bar .title { flex: 1; min-width: 60px; font: 600 22px/1.2 var(--font); letter-spacing: -0.02em; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink); padding: 4px 2px; }
  .bar .title:hover { border-bottom-color: var(--grey); }
  .bar .title:focus { outline: none; border-bottom-color: var(--ink); }
  .bar .tools { display: flex; gap: 8px; align-items: center; }
  .bar select { font: 500 14px var(--font); height: 34px; padding: 0 6px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); max-width: 170px; border-radius: 0; }

  .tabs { grid-column: 1; display: flex; border-right: 3px solid var(--ink); background: var(--paper); }
  .tabs button { flex: 1; padding: 12px 10px 10px; border: 0; border-bottom: 3px solid var(--grey); background: none; font: 500 15px var(--font); color: var(--ink-2); cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }
  .tabs .only-sm { display: none; }
  .panel { grid-column: 1; grid-row: 3; min-height: 0; display: flex; flex-direction: column; border-right: 3px solid var(--ink); background: var(--paper); }
  .app[data-view="edit"] .chat, .app:not([data-view="edit"]) .editor { display: none; }

  .log { flex: 1; overflow-y: auto; padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { font-size: 18px; line-height: 1.45; padding-left: 14px; border-left: 4px solid var(--red); }
  .msg.me { align-self: flex-end; background: var(--panel); padding: 9px 13px; font-size: 16px; }
  .msg.err { color: var(--red); font-size: 15px; font-weight: 500; }
  .typing { color: var(--ink-2); padding-left: 18px; }
  .typing::after { content: '…'; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.1em; } }
  .compose { display: flex; gap: 10px; padding: 12px 16px 16px; border-top: 2px solid var(--ink); align-items: flex-end; }
  .compose textarea { flex: 1; resize: none; font: 16px/1.4 var(--font); padding: 10px 12px; border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); min-height: 48px; max-height: 160px; }
  .compose textarea:focus { outline: none; border-color: var(--blue); }
  .hint { font-size: 12px; color: var(--ink-2); padding: 0 16px 10px; margin: -8px 0 0; }

  .editor { overflow-y: auto; padding: 20px 20px 40px; }
  .editor h3 { font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .editor h3 + p { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; }
  .editor section + section { margin-top: 32px; }
  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .people li { display: grid; grid-template-columns: 30px 1fr 1fr 28px; gap: 6px; align-items: center; }
  .sw { width: 30px; height: 30px; border: 2px solid var(--ink); cursor: pointer; padding: 0; }
  .ed-in, .ev-form input, .ev-form select, .ev-form textarea { font: 15px/1.3 var(--font); padding: 7px 8px; border: 2px solid var(--grey); border-radius: 0; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
  .ed-in:focus, .ev-form input:focus, .ev-form select:focus, .ev-form textarea:focus { outline: none; border-color: var(--ink); }
  .x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 0; }
  .x:hover { color: var(--red); }
  .events { list-style: none; margin: 0; padding: 0; }
  .events > li { border-top: 2px solid var(--ink); }
  .events > li:last-child { border-bottom: 2px solid var(--ink); }
  .ev-row { width: 100%; display: grid; grid-template-columns: 12px 4.2em 1fr; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 10px 2px; font: 15px/1.35 var(--font); color: var(--ink); cursor: pointer; }
  .ev-row:hover { background: var(--panel); }
  .ev-row i { width: 12px; height: 12px; transform: translateY(1px); }
  .ev-row b { font-weight: 600; }
  .ev-row em { font-style: normal; color: var(--ink-2); display: block; font-size: 13px; }
  .ev-row em.warn { color: var(--red); }
  .ev-form { padding: 14px 0 16px; display: grid; gap: 10px; }
  .ev-form label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .ev-form .row { display: flex; gap: 8px; align-items: center; }
  .ev-form .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .ev-form textarea { resize: vertical; min-height: 56px; }
  .geo { font-size: 14px; font-weight: 500; flex: 1; }
  .geo.ok::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); margin-right: 6px; }
  .geo.no { color: var(--red); }
  .ev-form .actions { display: flex; gap: 8px; margin-top: 4px; }
  .ev-form .actions .del { margin-left: auto; color: var(--red); }

  .mapcol { grid-column: 2; grid-row: 2 / 4; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  .empty { position: absolute; z-index: 500; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, 84%); background: var(--paper); border: 3px solid var(--ink); padding: 24px; }
  .empty h2 { font-size: 28px; letter-spacing: -0.03em; }
  .empty p { margin: 10px 0 0; color: var(--ink-2); font-size: 16px; }
  .legendbox { position: absolute; z-index: 500; left: 12px; bottom: 26px; background: var(--paper); border: 2px solid var(--ink); padding: 10px 12px; max-width: min(420px, calc(100% - 24px)); }
  .pickbar { position: absolute; z-index: 700; left: 50%; top: 14px; transform: translateX(-50%); background: var(--yellow); border: 2px solid var(--ink); padding: 8px 10px 8px 14px; display: flex; gap: 12px; align-items: center; font-weight: 500; max-width: calc(100% - 24px); }

  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .bar .btn.small { padding: .5em .6em; font-size: 13px; }
    .bar .title { min-width: 0; }
    .tabs { border-right: 0; }
    .tabs .only-sm { display: block; }
    .panel { border-right: 0; }
    .mapcol { grid-column: 1; grid-row: 3; }
    .app[data-view="map"] .panel { display: none; }
    .app:not([data-view="map"]) .mapcol { display: none; }
    .bar { gap: 8px; padding: 8px 10px; }
    .bar .title { font-size: 18px; }
    .bar .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="app" data-view="chat">
  <header class="bar">
    <a class="brand" href="/" aria-label="MapHeritage"><svg width="36" height="20" viewBox="0 0 36 20" aria-hidden="true"><path d="M5 15 L18 5 L31 15" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/><circle cx="5" cy="15" r="4" fill="#E0301E" stroke="#000" stroke-width="2"/><circle cx="18" cy="5" r="4" fill="#F2B705" stroke="#000" stroke-width="2"/><circle cx="31" cy="15" r="4" fill="#1F3FBF" stroke="#000" stroke-width="2"/></svg><span>MapHeritage</span></a>
    <input class="title" id="title" data-i18n-ph="title.ph" placeholder="My family map" maxlength="80" aria-label="Map title">
    <div class="tools">
      <select id="myMaps" class="hide-sm" hidden data-i18n-label="myMaps"></select>
      <button class="langbtn" type="button" data-lang-toggle>RU</button>
      <button class="btn small hide-sm" id="newMap" type="button" data-i18n="btn.new">New map</button>
      <a class="btn small hide-sm" id="viewMap" href="#" target="_blank" rel="noopener" data-i18n="btn.open">Open map</a>
      <button class="btn small" id="export" type="button" data-i18n="btn.export">Export PNG</button>
      <button class="btn small primary" id="share" type="button" data-i18n="btn.share">Share</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="chat" data-i18n="tab.chat">Chat</button>
    <button role="tab" aria-selected="false" data-view="edit" data-i18n="tab.edit">Edit</button>
    <button role="tab" aria-selected="false" data-view="map" class="only-sm" data-i18n="tab.map">Map</button>
  </nav>

  <section class="panel chat">
    <div class="log" id="log" aria-live="polite"></div>
    <form class="compose" id="form">
      <textarea id="input" rows="1" data-i18n-ph="input.ph" placeholder="Type your answer…" maxlength="2000" aria-label="Your answer"></textarea>
      <button class="btn primary" id="send" type="submit" data-i18n="btn.send">Send</button>
    </form>
    <p class="hint" data-i18n="hint">Enter to send, Shift + Enter for a new line. Only people with the link can see the map.</p>
  </section>

  <section class="panel editor" id="editor"></section>

  <section class="mapcol">
    <div id="map"></div>
    <div class="empty" id="empty"><h2 data-i18n="empty.t">Your map will appear here</h2><p data-i18n="empty.p">Answer the questions on the left. Every place you mention lands on the map.</p></div>
    <div class="legendbox" id="legendbox" hidden><ul class="legend" id="legend"></ul></div>
    <div class="pickbar" id="pickbar" hidden><span data-i18n="f.picking">Click the map to set the location</span><button class="btn small" type="button" id="pickCancel" data-i18n="f.cancel">Cancel</button></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/mapkit.js"></script>
<script src="/assets/create.js"></script>
</body>
</html>
