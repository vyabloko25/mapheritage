<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
<title>Plans — MapHeritage</title>
<style>
  .top { display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 4vw, 48px); }
  .top .btn { margin-left: auto; }
  main { max-width: 1040px; margin: 0 auto; padding: clamp(32px, 6vw, 80px) clamp(16px, 4vw, 48px) 80px; }
  h1 { font-size: clamp(36px, 5vw, 56px); margin-bottom: 36px; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .plan { background: var(--card); border: 1px solid var(--rule); padding: 28px 26px 30px; position: relative; display: flex; flex-direction: column; }
  .plan::before { content: ''; position: absolute; inset: 5px; border: 1px solid var(--rule); pointer-events: none; }
  .plan.pro { border-color: var(--ink); } .plan.pro::before { border-color: var(--ink); }
  .plan h2 { font-size: 30px; display: flex; align-items: baseline; justify-content: space-between; }
  .plan h2 small { font: italic 18px var(--serif); color: var(--ink-2); }
  .plan ul { margin: 18px 0 26px; padding-left: 20px; font: 17px/1.6 var(--serif); flex: 1; }
  .plan .cur { font: italic 15px var(--serif); color: var(--red); }
  .privacy { margin-top: 48px; font: 17px/1.6 var(--serif); color: var(--ink-2); max-width: 44em; }
  @media (max-width: 760px) { .plans { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"><a class="brand" href="/"><svg class="logo" width="32" height="32" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="32" cy="32" r="28.5" stroke="currentColor" stroke-width="2.4"/> <path d="M6.5 25 Q32 31 57.5 25 M6 41 Q32 47 58 41 M32 3.5 Q21 32 32 60.5" stroke="currentColor" stroke-width="1.2" opacity=".3"/> <path d="M32 3.5 l-2.4 5 h4.8 z" fill="currentColor" stroke="none"/> <path d="M30 52 C31.5 46 33.5 42 33.5 37 C33.5 31.5 26 28 18.5 21.5" stroke="currentColor" stroke-width="3.6"/> <path d="M33.3 38 C36 31.5 40 25.5 44.5 19" stroke="currentColor" stroke-width="3.2"/> <path d="M38.6 28.5 C43.5 29 47.5 31.5 49.5 35.5" stroke="currentColor" stroke-width="2.6"/> <circle cx="30" cy="52.5" r="5.2" fill="#9B2F1F" stroke="none"/> <circle cx="17.5" cy="20.5" r="3.9" fill="currentColor" stroke="none"/> <circle cx="46" cy="16.8" r="3.9" fill="var(--logo-bg, #EFE6CF)" stroke="currentColor" stroke-width="2.4"/> <circle cx="50" cy="36.5" r="2.9" fill="currentColor" stroke="none"/></svg> MapHeritage</a><button class="langbtn" type="button" data-lang-toggle>RU</button><a class="btn small primary" href="/create" data-i18n="nav.create">Create a map</a></header>
<main>
  <h1 data-i18n="pl.title">Plans</h1>
  <div class="plans">
    <section class="plan"><h2><span data-i18n="pl.lite">Lite</span><small data-i18n="pl.free">Free</small></h2>
      <ul><li data-i18n="pl.lite.1"></li><li data-i18n="pl.lite.2"></li><li data-i18n="pl.lite.3"></li><li id="liteN"></li></ul><p class="cur" id="curLite" hidden data-i18n="pl.current"></p><a class="btn" href="/create" id="liteBtn" data-i18n="hero.cta"></a></section>
    <section class="plan pro"><h2><span data-i18n="pl.pro">Pro</span></h2>
      <ul><li data-i18n="pl.pro.1"></li><li data-i18n="pl.pro.2"></li><li data-i18n="pl.pro.3"></li><li data-i18n="pl.pro.4"></li></ul><p class="cur" id="curPro" hidden data-i18n="pl.current"></p><p class="cur" id="reqDone" hidden data-i18n="pl.requested"></p><button class="btn primary" type="button" id="req" data-i18n="pl.request">I want Pro</button></section>
  </div>
  <p class="privacy"><b data-i18n="p.title"></b>. <span data-i18n="p.1"></span> <span data-i18n="p.2"></span></p>
</main>
<footer class="sitefoot"><span>© MapHeritage · <a href="/plans" data-i18n="pl.title">Plans</a> · <a href="/impressum" data-i18n="legal.impressum">Impressum</a> · <a href="/datenschutz" data-i18n="legal.privacy">Privacy</a> · <a href="/agb" data-i18n="legal.terms">Terms</a></span><span data-i18n="footer.base">Base map: Natural Earth, ETOPO5 (NOAA)</span></footer>
<script src="/assets/i18n.js"></script>
<script src="/assets/fit.js"></script><script src="/assets/account.js"></script>
<script src="/assets/plans.js"></script>
</body>
</html>
